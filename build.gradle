plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// Shared setup for both mods; per-mod wiring lives in each subproject
subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'
	apply plugin: 'java'

	version = "${mod_version}+${minecraft_version}"
	group = maven_group

	base {
		archivesName = project.name
	}

	loom {
		// Keeps client-only classes out of the server classpath at compile time
		splitEnvironmentSourceSets()
	}

	// Adds the gametest source set and runGameTest tasks (D-11)
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "${project.name}-gametest"
			enableGameTests = true
			// Client game tests start a full client; only tconstruct (which loads mantle) needs one
			enableClientGameTests = project.name == 'tconstruct'
			// WHY: accepting the Minecraft EULA is the user's choice; opt in with -Pminecraft_eula=true
			eula = providers.gradleProperty('minecraft_eula').map { it.toBoolean() }.orElse(false)
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

		// WHY: upstream uses Lombok in ~600 files; keeping it keeps ports diffable (D-14)
		compileOnly "org.projectlombok:lombok:${lombok_version}"
		annotationProcessor "org.projectlombok:lombok:${lombok_version}"
		clientCompileOnly "org.projectlombok:lombok:${lombok_version}"
		clientAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"
		testCompileOnly "org.projectlombok:lombok:${lombok_version}"
		testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"

		testImplementation platform("org.junit:junit-bom:${junit_version}")
		testImplementation 'org.junit.jupiter:junit-jupiter'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		// Boots Fabric Loader inside JUnit so tests can touch Minecraft registries
		testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
	}

	processResources {
		def version = project.version
		inputs.property 'version', version

		filesMatching('fabric.mod.json') {
			expand 'version': version
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = java_version as int
		it.options.encoding = 'UTF-8'
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.toVersion(java_version)
		targetCompatibility = JavaVersion.toVersion(java_version)
	}

	test {
		useJUnitPlatform()
	}

	jar {
		def projectName = project.name
		inputs.property 'projectName', projectName

		from(rootProject.file('LICENSE')) {
			rename { "${it}_${projectName}" }
		}
	}
}
