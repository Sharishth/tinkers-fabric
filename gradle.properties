# Gradle: Loom and decompilation need more than the 1G default
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Off until the multi-project Loom setup is proven cache-safe
org.gradle.configuration-cache=false

# Java release the mods compile for; scripts/ check the JDK against this too
java_version=25

# Fabric (pinned, see .md_references decision D-02; check https://fabricmc.net/develop)
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.0+26.3

# Build-time libraries
lombok_version=1.18.48
junit_version=6.1.3

# Mod
mod_version=0.1.0-alpha
maven_group=io.github.sharishth.tinkersfabric